<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Character</title>
  <link rel="stylesheet" href="select.css">
</head>
<body>

  <main class="select-screen">
    <!-- EDIT HERE: Top Blurb / Story Prompt -->
    <header class="blurb-box">
      <h1>Choose Your Character</h1>
      <p id="intro-blurb">
        This is an interactive game to help show the impact that different perspectives of body image issues can have on the people around you, especially on ones body image. Please pick your character and enjoy this experience!
      </p>
    </header>

    <!-- EDIT HERE: Three Character Options (Update data-avatar and src="...") -->
    <section class="character-grid">
      <button class="char-card" 
      data-theme="appearance"
      data-avatar="images/ch1.png"
      data-stranger="images/ch1stranger.png" 
      data-mirror="images/ch1mirror.png">
        <img src="images/ch1.png" alt="Character 1">
        <h2>Appearance Comments</h2>
        <p>This experience will show interactions of appearance based comments.</p>
      </button>

      <button class="char-card" 
      data-theme="worth"
      data-avatar="images/ch2.png"
      data-stranger="images/ch2stranger.png" 
      data-mirror="images/ch2mirror.png">
        <img src="images/ch2.png" alt="Character 2">
        <h2>Overevaluation of body shape</h2>
        <p>This experience will show interacations from one who attributes their self-worth to their body shape, and assumes others do too.</p>
      </button>

      <button class="char-card" 
      data-theme="rejection"
      data-avatar="images/ch3.png"
      data-stranger="images/ch3stranger.png" 
      data-mirror="images/ch3mirror.png">
        <img src="images/ch3.png" alt="Character 3">
        <h2>Appearance-based rejection sensitivity</h2>
        <p>This experience will show interactions from one who experiences appearance-based rejection sensitivity.</p>
      </button>
    </section>
  </main>

  <script>
    document.querySelectorAll('.char-card').forEach((card) => {
      card.addEventListener('click', () => {
        localStorage.setItem('selectedTheme', card.getAttribute('data-theme'));
        localStorage.setItem('selectedAvatar', card.getAttribute('data-avatar'));
        localStorage.setItem('selectedStranger', card.getAttribute('data-stranger'));
        localStorage.setItem('selectedMirror', card.getAttribute('data-mirror'));
        window.location.href = 'story.html';
      });
    });
  </script>

</body>
</html>
